<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="assets/audio/voice.js"></script>
    <style>
      :root {
        --ground: #070b18;
        --ink: #eef3ff;
        --gold: #ffb547;
        --cyan: #3ef0ff;
        --magenta: #ff3d9a;
        --muted: #8a96b8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="47.5" data-width="1920" data-height="1080">
      <div id="bg" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="47.5"
        data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="trailer" data-composition-id="trailer" data-composition-src="compositions/trailer.html" data-start="0"
        data-duration="28.9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"
        style="z-index: 2"></div>
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html" data-start="28.6"
        data-duration="4.1" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"
        style="z-index: 3"></div>
      <div id="howto" data-composition-id="howto" data-composition-src="compositions/howto.html" data-start="32.7"
        data-duration="11" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"
        style="z-index: 4"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="43.7"
        data-duration="3.8" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"
        style="z-index: 5"></div>

      <!-- Voice: the clock of the film; every beat below is timed to voice.json + 1.0 s -->
      <audio id="voice" class="clip" src="assets/audio/voice-swap.wav" data-start="1" data-duration="27.5" data-track-index="10" data-volume="1"></audio>

      <!-- Sound on visible actions, under the voice -->
      <audio id="sfx-open" class="clip" src="assets/sfx/whoosh.mp3" data-start="0.15" data-duration="0.57" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-chip1" class="clip" src="assets/sfx/pop.mp3" data-start="5.2" data-duration="0.72" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-chip2" class="clip" src="assets/sfx/pop.mp3" data-start="14.05" data-duration="0.72" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-glitch" class="clip" src="assets/sfx/glitch-1.mp3" data-start="17.72" data-duration="2.64" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-glitch2" class="clip" src="assets/sfx/glitch-3.mp3" data-start="18.2" data-duration="3.1" data-track-index="14" data-volume="0.3"></audio>
      <audio id="sfx-chip3" class="clip" src="assets/sfx/pop.mp3" data-start="21.9" data-duration="0.72" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-lang" class="clip" src="assets/sfx/ping.mp3" data-start="24.5" data-duration="1.32" data-track-index="15" data-volume="0.3"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="19.0" data-duration="10.03" data-track-index="16" data-volume="0.22"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="29.0" data-duration="2.12" data-track-index="17" data-volume="0.6"></audio>
      <audio id="sfx-howto" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="32.65" data-duration="0.57" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-type1" class="clip" src="assets/sfx/typing.mp3" data-start="33.4" data-duration="1.5" data-track-index="18" data-volume="0.25"></audio>
      <audio id="sfx-type2" class="clip" src="assets/sfx/typing.mp3" data-start="37.0" data-duration="1.5" data-track-index="18" data-volume="0.25"></audio>
      <audio id="sfx-type3" class="clip" src="assets/sfx/typing.mp3" data-start="40.6" data-duration="1.5" data-track-index="18" data-volume="0.25"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/sparkle.mp3" data-start="43.8" data-duration="1.8" data-track-index="19" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
