  <script>
    (function () {
      const V = window.VOICE, T = window.TIMING;
      const VOICE_START = T.VOICE_START, DURATION = T.TRAILER;
      const G0 = T.G0 ?? 1e9, G1 = T.G1 ?? 1e9, SWAP = T.SWAP ?? 1e9; // glitch window and the moment the hologram takes over
      const LANG = T.LANG ?? 1e9;
      const TAG = /\[(chuckle|sigh|laugh|gasp)\]/;
      const segs = V.segments.map((s) => ({ ...s, a: s.start + VOICE_START, b: s.end + VOICE_START }));
      const NAMES = { mehdi: "DR. MEHDI", nova: "NOVA · AI", system: "SYSTEM" };
      const TAG_EMO = { chuckle: "AMUSED", sigh: "EMOTIONAL", laugh: "LAUGHING", gasp: "SHOCKED" };
      const label = (s) => {
        if (s.voice === "system") return "ALERT";
        const m = s.text.match(TAG);
        return m ? TAG_EMO[m[1]] : s.emotion.toUpperCase();
      };
      const engine = (s) => (s.voice === "system" ? "stock" : s.lang !== "en" ? "multilingual" : TAG.test(s.text) ? "turbo" : "classic");

      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const env = (t) => {
        const f = Math.floor((t - VOICE_START) * V.fps);
        return f >= 0 && f < V.env.length ? V.env[f] : 0;
      };
      const $ = (id) => document.getElementById(id);
      const faces = ["closed", "half", "open", "laugh", "surprised", "sad", "hclosed", "hhalf", "hopen", "hsmirk"]
        .reduce((o, k) => ((o[k] = $("av-" + k)), o), {});
      const slices = [0, 1, 2, 3, 4].map((i) => $("sl-" + i));
      const hud = { voice: $("hud-voice"), lang: $("hud-lang"), emo: $("hud-emo"), engine: $("hud-engine"),
        fill: $("hud-meter-fill"), dot: $("rec-dot") };
      const wrap = $("av-stack"), scan = $("scan"), avR = $("av-r"), avB = $("av-b");
      let shown = null;

      function show(face) {
        if (face === shown) return;
        for (const k in faces) faces[k].style.opacity = k === face ? 1 : 0;
        shown = face;
      }

      // Latest segment that has started, so everything depends on t alone.
      function segAt(t) {
        let i = 0;
        segs.forEach((s, k) => { if (t >= s.a - 0.05) i = k; });
        return segs[i];
      }

      function pickFace(t) {
        if (t >= G0 && t < SWAP) return "surprised"; // he hears the alert as the glitch takes him
        const holo = t >= SWAP;
        const s = segAt(t);
        const e2 = Math.max(env(t), env(t - 1 / 30));
        const mouth = e2 < 0.1 ? "closed" : e2 < 0.38 ? "half" : "open";
        const m = t >= s.a && t < s.b && s.text.match(TAG);
        if (m && (m[1] === "laugh" || m[1] === "chuckle")) {
          if (holo) return e2 > 0.5 ? "hopen" : "hsmirk";
          // Mid-line chuckle: about where the tag sits in the text.
          const at = (m.index / s.text.length) * (s.b - s.a), rel = t - s.a;
          if (rel > at - 0.1 && rel < at + 0.8) return "laugh";
        }
        if (m && m[1] === "sigh" && e2 < 0.14) return "sad";
        return holo ? "h" + mouth : mouth;
      }

      function renderAt(t) {
        const e = env(t);
        show(pickFace(t));
        const bob = Math.sin(t * 1.6) * 4 - e * 6;
        wrap.style.transform = `translateY(${bob}px) scale(${1 + e * 0.012})`;

        // Glitch: RGB split and displaced slices, seeded per frame.
        const inG = t >= G0 && t < G1;
        const r = mulberry32(Math.floor(t * 30) * 13 + 5);
        avR.style.opacity = inG ? 0.55 : 0;
        avB.style.opacity = inG ? 0.55 : 0;
        avR.style.transform = `translateX(${inG ? 10 + r() * 22 : 0}px)`;
        avB.style.transform = `translateX(${inG ? -(10 + r() * 22) : 0}px)`;
        slices.forEach((sl) => {
          const on = inG && r() > 0.35;
          const top = Math.floor(r() * 85), h = 4 + Math.floor(r() * 12);
          sl.style.opacity = on ? 1 : 0;
          sl.style.clipPath = `inset(${top}% 0 ${Math.max(0, 100 - top - h)}% 0)`;
          sl.style.transform = `translateX(${(r() - 0.5) * 120}px)`;
        });
        scan.style.opacity = t >= SWAP ? 0.6 + 0.2 * Math.sin(t * 9) : inG ? 0.9 : 0;

        // HUD readout.
        const s = segAt(t), holo = t >= SWAP;
        hud.voice.textContent = NAMES[s.voice] || s.voice.toUpperCase();
        hud.voice.style.color = s.voice === "system" ? "#ff3d9a" : holo ? "#3ef0ff" : "#eef3ff";
        hud.lang.textContent = t >= LANG - 0.1 ? "AR · العربية" : "EN · English";
        hud.emo.textContent = label(s);
        hud.engine.textContent = "chatterbox · " + engine(s);
        hud.fill.style.transform = `scaleX(${0.04 + e * 0.96})`;
        hud.fill.style.background = s.voice === "system" ? "#ff3d9a" : holo ? "#3ef0ff" : "#ffb547";
        hud.dot.style.opacity = Math.floor(t * 2) % 2 ? 0.35 : 1;
      }

      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);

      // Entrances, then each generated overlay animates on its own clip times.
      tl.fromTo("#av-wrap", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.1);
      tl.fromTo("#hud-left .row", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.08, ease: "power3.out" }, 0.3);
      tl.fromTo("#hud-right .row", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.08, ease: "power3.out" }, 0.4);
      const times = (el) => [parseFloat(el.dataset.start), parseFloat(el.dataset.duration)];
      document.querySelectorAll("#root .chip").forEach((c) => {
        const [a, d] = times(c), inner = c.querySelector(".chip-in");
        tl.fromTo(inner, { scale: 0.4, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.3, ease: "back.out(2.4)" }, a);
        tl.to(inner, { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" }, a + d - 0.3);
      });
      document.querySelectorAll("#root .banner").forEach((b) => {
        const [a, d] = times(b), inner = b.querySelector(".banner-in");
        tl.fromTo(inner, { scaleX: 0.2, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.18, ease: "power4.out" }, a);
        tl.to(inner, { opacity: 0, duration: 0.25 }, a + d - 0.3);
      });
      document.querySelectorAll("#root .cap").forEach((c) => {
        const [a, d] = times(c), inner = c.querySelector(".cap-in");
        tl.fromTo(inner, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, a);
        tl.to(inner, { opacity: 0, duration: 0.18, ease: "power1.in" }, a + d - 0.22);
      });
      tl.to(["#av-wrap", "#hud-left", "#hud-right"], { opacity: 0, duration: 0.35, ease: "power2.in" }, DURATION - 0.45);

      renderAt(0);
      window.__timelines["trailer"] = tl;
    })();
  </script>
