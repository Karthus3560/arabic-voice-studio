  <script>
    (function () {
      const V = window.VOICE;
      const VOICE_START = 1.0;
      const G0 = 17.72, G1 = 18.62, SWAP = 18.15; // glitch window and the moment the hologram takes over
      const DURATION = 28.9;
      const segs = V.segments.map((s) => ({ ...s, a: s.start + VOICE_START, b: s.end + VOICE_START }));
      const EMO = ["CALM", "AMUSED", "HYPE", "EMOTIONAL", "SURPRISED", "LAUGHING", "WARM"];
      const ENGINE = ["classic", "turbo", "classic", "turbo", "classic", "turbo", "multilingual"];

      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const env = (t) => {
        const f = Math.floor((t - VOICE_START) * V.fps);
        return f >= 0 && f < V.env.length ? V.env[f] : 0;
      };
      const $ = (id) => document.getElementById(id);
      const faces = ["closed", "half", "open", "laugh", "surprised", "sad", "hclosed", "hhalf", "hopen", "hsmirk"]
        .reduce((o, k) => ((o[k] = $("av-" + k)), o), {});
      const slices = [0, 1, 2, 3, 4].map((i) => $("sl-" + i));
      const hud = { voice: $("hud-voice"), lang: $("hud-lang"), emo: $("hud-emo"), engine: $("hud-engine"),
        fill: $("hud-meter-fill"), dot: $("rec-dot") };
      const wrap = $("av-stack"), scan = $("scan"), avR = $("av-r"), avB = $("av-b");
      let shown = null;

      function show(face) {
        if (face === shown) return;
        for (const k in faces) faces[k].style.opacity = k === face ? 1 : 0;
        shown = face;
      }

      function pickFace(t) {
        const holo = t >= SWAP;
        if (t >= G0 && t < SWAP) return t < G0 + 0.22 ? "surprised" : "open";
        const seg = segs.findIndex((s) => t >= s.a && t < s.b);
        const e = env(t), e2 = Math.max(e, env(t - 1 / 30));
        const mouth = e2 < 0.1 ? "closed" : e2 < 0.38 ? "half" : "open";
        if (seg === 1) {
          const rel = t - segs[1].a;
          if (rel > 1.25 && rel < 2.1) return "laugh";
        }
        if (seg === 3 && e2 < 0.14) return "sad";
        if (seg === 5) return e2 > 0.5 ? "hopen" : "hsmirk";
        return holo ? "h" + mouth : mouth;
      }

      function renderAt(t) {
        const e = env(t);
        show(pickFace(t));
        // Breath and voice-driven bob.
        const bob = Math.sin(t * 1.6) * 4 - e * 6;
        wrap.style.transform = `translateY(${bob}px) scale(${1 + e * 0.012})`;

        // Glitch: RGB split and displaced slices, seeded per frame.
        const inG = t >= G0 && t < G1;
        const r = mulberry32(Math.floor(t * 30) * 13 + 5);
        avR.style.opacity = inG ? 0.55 : 0;
        avB.style.opacity = inG ? 0.55 : 0;
        avR.style.transform = `translateX(${inG ? 10 + r() * 22 : 0}px)`;
        avB.style.transform = `translateX(${inG ? -(10 + r() * 22) : 0}px)`;
        slices.forEach((s) => {
          const on = inG && r() > 0.35;
          const top = Math.floor(r() * 85), h = 4 + Math.floor(r() * 12);
          s.style.opacity = on ? 1 : 0;
          s.style.clipPath = `inset(${top}% 0 ${Math.max(0, 100 - top - h)}% 0)`;
          s.style.transform = `translateX(${(r() - 0.5) * 120}px)`;
        });
        scan.style.opacity = t >= SWAP ? 0.6 + 0.2 * Math.sin(t * 9) : inG ? 0.9 : 0;

        // HUD readout.
        // Latest segment that has started, so the readout depends on t alone.
        let seg = 0;
        segs.forEach((s, i) => { if (t >= s.a - 0.05) seg = i; });
        const holo = t >= SWAP;
        if (inG) {
          const chars = "#$%&@!?01ABCDEFXZ";
          hud.voice.textContent = Array.from({ length: 9 }, () => chars[Math.floor(r() * chars.length)]).join("");
          hud.voice.style.color = "#ff3d9a";
        } else {
          hud.voice.textContent = holo ? "CLONE #2" : "DR. MEHDI";
          hud.voice.style.color = holo ? "#3ef0ff" : "#eef3ff";
        }
        hud.lang.textContent = t >= segs[6].a - 0.1 ? "AR · العربية" : "EN · English";
        hud.emo.textContent = inG ? "???" : EMO[seg];
        hud.engine.textContent = "chatterbox · " + ENGINE[seg];
        hud.fill.style.transform = `scaleX(${0.04 + e * 0.96})`;
        hud.fill.style.background = holo ? "#3ef0ff" : "#ffb547";
        hud.dot.style.opacity = Math.floor(t * 2) % 2 ? 0.35 : 1;
      }

      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);

      // Entrances.
      tl.fromTo("#av-wrap", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.1);
      tl.fromTo("#hud-left .row", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.08, ease: "power3.out" }, 0.3);
      tl.fromTo("#hud-right .row", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.08, ease: "power3.out" }, 0.4);
      [["#chip-chuckle", 5.2], ["#chip-sigh", 14.05], ["#chip-laugh", 21.9]].forEach(([sel, at]) => {
        tl.fromTo(sel + " .chip-in", { scale: 0.4, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.3, ease: "back.out(2.4)" }, at);
        tl.to(sel + " .chip-in", { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" }, at + 1.2);
      });
      tl.fromTo("#swap-in", { scaleX: 0.2, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.18, ease: "power4.out" }, 17.9);
      tl.to("#swap-in", { opacity: 0, duration: 0.25 }, 20.05);
      tl.fromTo("#lang-in", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 24.45);
      tl.to("#lang-in", { opacity: 0, duration: 0.25 }, 26.05);
      document.querySelectorAll("#root .cap").forEach((c) => {
        const a = parseFloat(c.dataset.start), d = parseFloat(c.dataset.duration);
        const inner = c.querySelector(".cap-in");
        tl.fromTo(inner, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, a);
        tl.to(inner, { opacity: 0, duration: 0.18, ease: "power1.in" }, a + d - 0.22);
      });
      tl.to(["#av-wrap", "#hud-left", "#hud-right"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 28.45);

      renderAt(0);
      window.__timelines["trailer"] = tl;
    })();
  </script>
